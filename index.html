<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Navbar</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="hero">

        <nav class="navbar">
            <div class="logo">
                <img src="pokemon-logo-png-1421.png" alt="Pokemon">
            </div>

            <button class="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>

        <section class="content">
            <div class="text">
                <p class="subtitle">POKEMON GEN I</p>

                <h1>Pikachu</h1>

                <p class="description">
                    Pikachu is an Electric-type Pokémon introduced
                    in Generation I. Pikachu are small, chubby,
                    and incredibly cute mouse-like Pokémon.
                    They are almost completely covered by
                    yellow fur.
                </p>

                <div class="counter">
                    <span></span>
                    01 / 08
                </div>
            </div>

            <div class="pokemon">
                <img src="./pikachu-transparent-32576.png" alt="Pikachu">
            </div>
        </section>

    </main>

</body>

</html>
